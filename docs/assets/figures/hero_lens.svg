<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
<title id="title">Xiaomi-Lens-0: ask, reason, locate, segment</title>
<desc id="desc">A lens scans a tabletop scene for the query “what could package a gift?”. After a short reasoning trace, the model emits two mask tokens and draws a box and an orange mask on each of the two gift boxes.</desc>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#cfe3e3"/></pattern>
  <clipPath id="scene"><rect x="24" y="120" width="592" height="200" rx="16"/></clipPath>
</defs>
<style>
  text { font-family: Fredoka, Nunito, "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #14293f; }
  .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
  .o { stroke: #1e3450; stroke-width: 2.5; stroke-linejoin: round; }
  .tk-img { fill: #dbe9f4; stroke: #6d9cc2; stroke-width: 1.5; }
  .tk-txt { fill: #dff0ed; stroke: #5a9e94; stroke-width: 1.5; }
  .tk-ans { fill: #fff0d8; stroke: #e8a066; stroke-width: 1.5; }
  .tk-mask { fill: #ffc08f; stroke: #ff6900; stroke-width: 1.8; stroke-dasharray: 3 2; }
  .a, .lens, .steam { transform-box: fill-box; transform-origin: center; }
  .a { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.3,1.4,.5,1); }
  .reveal { transform-origin: right center; transform: scaleX(0); }
  .lens { transform-box: view-box; transform-origin: 0 0; transform:translate(556px,178px); animation: sweep 10s infinite cubic-bezier(.6,0,.3,1); }
  .steam { animation: steam 2.6s infinite ease-in-out; }
  .steam + .steam { animation-delay: -1.3s; }
  @keyframes steam { 0%,100% { opacity: .25; transform: translateY(3px); } 50% { opacity: .9; transform: translateY(-3px); } }
  @keyframes t0{0%,8%{opacity:0;transform:scale(.6)}10%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t1{0%,11%{opacity:0;transform:scale(.6)}13%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t2{0%,14%{opacity:0;transform:scale(.6)}16%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t3{0%,26%{opacity:0;transform:scale(.6)}28%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t4{0%,34%{opacity:0;transform:scale(.6)}36%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t5{0%,37%{opacity:0;transform:scale(.6)}39%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t6{0%,40%{opacity:0;transform:scale(.6)}42%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t7{0%,46%{opacity:0;transform:scale(.6)}48%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t8{0%,58%{opacity:0;transform:scale(.6)}60%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes t9{0%,61%{opacity:0;transform:scale(.6)}63%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes mt1{0%,26%{opacity:0;transform:scale(.4)}28%{opacity:1;transform:scale(1.5);fill:#ff6900}34%,92%{opacity:1;transform:scale(1);fill:#ffc08f}97%,100%{opacity:0}}
  @keyframes mt2{0%,46%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(1.5);fill:#ff6900}54%,92%{opacity:1;transform:scale(1);fill:#ffc08f}97%,100%{opacity:0}}
  @keyframes q{0%,0%{opacity:0;transform:translateY(-8px)}4%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
  @keyframes think{0%,5%{opacity:0}8%,92%{opacity:1}97%,100%{opacity:0}}
  @keyframes reveal{0%,7%{transform:scaleX(1)}25%,100%{transform:scaleX(0)}}
  @keyframes bb1{0%,26%{opacity:0;transform:scale(1.25)}29%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes mk1{0%,29%{opacity:0;transform:scale(.85)}35%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes tag1{0%,28%{opacity:0;transform:translateY(6px)}31%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
  @keyframes bb2{0%,46%{opacity:0;transform:scale(1.25)}49%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes mk2{0%,49%{opacity:0;transform:scale(.85)}55%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes tag2{0%,48%{opacity:0;transform:translateY(6px)}51%,92%{opacity:1;transform:translateY(0)}97%,100%{opacity:0}}
  @keyframes thumb{0%,31%{opacity:0}35%,92%{opacity:1}97%,100%{opacity:0}}
  @keyframes thumb2{0%,51%{opacity:0}55%,92%{opacity:1}97%,100%{opacity:0}}
  @keyframes ans{0%,64%{opacity:0;transform:scale(.8)}68%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
  @keyframes sweep{0%,5%{transform:translate(92px,232px)}18%,34%{transform:translate(205px,238px)}43%,55%{transform:translate(410px,230px)}66%,92%{transform:translate(556px,178px)}100%{transform:translate(92px,232px)}}
  .t0{animation-name:t0} .t1{animation-name:t1} .t2{animation-name:t2} .t3{animation-name:t3} .t4{animation-name:t4} .t5{animation-name:t5} .t6{animation-name:t6} .t7{animation-name:t7} .t8{animation-name:t8} .t9{animation-name:t9} .mt1{animation-name:mt1} .mt2{animation-name:mt2} .q{animation-name:q} .think{animation-name:think} .reveal{animation-name:reveal;animation-timing-function:steps(44,end)} .bb1{animation-name:bb1} .mk1{animation-name:mk1} .tag1{animation-name:tag1} .bb2{animation-name:bb2} .mk2{animation-name:mk2} .tag2{animation-name:tag2} .thumb{animation-name:thumb} .thumb2{animation-name:thumb2} .ans{animation-name:ans}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect width="640" height="400" fill="#fffaf2"/>

<!-- Query and reasoning trace -->
<g class="a q">
  <rect x="24" y="20" width="282" height="40" rx="20" fill="#fff0d8" class="o"/>
  <text x="44" y="46" font-size="16" font-weight="500">“what could package a gift?”</text>
</g>
<g class="a think">
  <rect x="24" y="72" width="420" height="32" rx="16" fill="#ffffff" stroke="#c9dfe3" stroke-width="2"/>
  <text x="40" y="93" font-size="12" class="mono" font-weight="700" style="fill:#b95018">think ›</text>
  <text x="104" y="93" font-size="12" class="mono">boxes with lids can hold a gift → 2 targets</text>
  <rect x="100" y="78" width="334" height="20" fill="#ffffff" class="a reveal"/>
</g>
<g class="a ans">
  <rect x="470" y="20" width="146" height="40" rx="20" fill="#173b63" class="o"/>
  <text x="543" y="45" font-size="15" font-weight="500" text-anchor="middle" style="fill:#ffffff">2 boxes · 2 masks</text>
</g>

<!-- Scene -->
<g clip-path="url(#scene)">
  <rect x="24" y="120" width="592" height="200" fill="#edf7f5"/>
  <rect x="24" y="120" width="592" height="158" fill="url(#dots)"/>
  <rect x="24" y="278" width="592" height="42" fill="#f8dfbf"/>
  <line x1="24" y1="278" x2="616" y2="278" class="o"/>
  <g fill="#ecc89a">
    <ellipse cx="100" cy="286" rx="30" ry="4"/><ellipse cx="205" cy="286" rx="54" ry="5"/>
    <ellipse cx="308" cy="286" rx="30" ry="4"/><ellipse cx="410" cy="286" rx="42" ry="5"/>
    <ellipse cx="532" cy="286" rx="56" ry="4"/>
  </g>
</g>
<text x="38" y="140" font-size="10" class="mono" style="fill:#52657a">input image</text>

<!-- Plant -->
<g class="o">
  <ellipse cx="100" cy="226" rx="9" ry="26" fill="#6fae8f" transform="rotate(-28 100 250)"/>
  <ellipse cx="100" cy="220" rx="9" ry="30" fill="#83c0a1"/>
  <ellipse cx="100" cy="226" rx="9" ry="26" fill="#6fae8f" transform="rotate(28 100 250)"/>
  <path d="M78 250 H122 L117 284 H83 Z" fill="#d9824a"/>
  <rect x="74" y="246" width="52" height="10" rx="3" fill="#e9995f"/>
</g>

<!-- Gift box 1 (target) -->
<g class="o">
  <rect x="162" y="218" width="86" height="66" fill="#7fb6d9"/>
  <rect x="199" y="218" width="12" height="66" fill="#fff8ec"/>
  <rect x="156" y="204" width="98" height="18" rx="3" fill="#94c5e4"/>
  <rect x="199" y="204" width="12" height="18" fill="#fff8ec"/>
  <ellipse cx="194" cy="196" rx="11" ry="7" fill="#fff8ec" transform="rotate(-18 194 196)"/>
  <ellipse cx="216" cy="196" rx="11" ry="7" fill="#fff8ec" transform="rotate(18 216 196)"/>
  <circle cx="205" cy="200" r="4.5" fill="#fff8ec"/>
</g>

<!-- Mug -->
<g class="o">
  <path d="M328 248 h7 a11 11 0 0 1 0 22 h-7" fill="none" stroke-width="4"/>
  <rect x="284" y="238" width="46" height="46" rx="6" fill="#ffffff"/>
  <rect x="284" y="254" width="46" height="9" fill="#7fc6b8"/>
</g>
<path class="steam" d="M298 228 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#9fb2c2" stroke-width="2.5" stroke-linecap="round"/>
<path class="steam" d="M314 228 q-5 -7 0 -14 q5 -7 0 -14" fill="none" stroke="#9fb2c2" stroke-width="2.5" stroke-linecap="round"/>

<!-- Gift box 2 (target) -->
<g class="o">
  <rect x="378" y="198" width="64" height="86" fill="#b9a6dd"/>
  <rect x="378" y="234" width="64" height="11" fill="#fff8ec"/>
  <rect x="404" y="198" width="12" height="86" fill="#fff8ec"/>
  <rect x="372" y="184" width="76" height="17" rx="3" fill="#c9b9e6"/>
  <rect x="404" y="184" width="12" height="17" fill="#fff8ec"/>
  <ellipse cx="399" cy="177" rx="10" ry="6.5" fill="#fff8ec" transform="rotate(-18 399 177)"/>
  <ellipse cx="421" cy="177" rx="10" ry="6.5" fill="#fff8ec" transform="rotate(18 421 177)"/>
  <circle cx="410" cy="181" r="4" fill="#fff8ec"/>
</g>

<!-- Books -->
<g class="o">
  <rect x="480" y="262" width="104" height="22" rx="3" fill="#6c9bc9"/>
  <rect x="490" y="242" width="88" height="20" rx="3" fill="#f2c14e"/>
  <line x1="498" y1="252" x2="566" y2="252" stroke="#b98a1f" stroke-width="2"/>
</g>

<!-- Masks -->
<g opacity=".55"><g class="a mk1">
  <path d="M156 204 H254 V222 H248 V284 H162 V222 H156 Z" fill="#ff6900"/>
  <ellipse cx="194" cy="196" rx="11" ry="7" fill="#ff6900" transform="rotate(-18 194 196)"/>
  <ellipse cx="216" cy="196" rx="11" ry="7" fill="#ff6900" transform="rotate(18 216 196)"/>
  <circle cx="205" cy="200" r="5" fill="#ff6900"/>
</g></g>
<g opacity=".55"><g class="a mk2">
  <path d="M372 184 H448 V201 H442 V284 H378 V201 H372 Z" fill="#ff6900"/>
  <ellipse cx="399" cy="177" rx="10" ry="6.5" fill="#ff6900" transform="rotate(-18 399 177)"/>
  <ellipse cx="421" cy="177" rx="10" ry="6.5" fill="#ff6900" transform="rotate(18 421 177)"/>
  <circle cx="410" cy="181" r="4.5" fill="#ff6900"/>
</g></g>

<!-- Boxes -->
<rect x="148" y="180" width="114" height="112" rx="6" fill="none" stroke="#ff6900" stroke-width="2.5" stroke-dasharray="8 5" class="a bb1"/>
<rect x="364" y="162" width="92" height="130" rx="6" fill="none" stroke="#ff6900" stroke-width="2.5" stroke-dasharray="8 5" class="a bb2"/>
<g class="a tag1">
  <rect x="148" y="160" width="62" height="18" rx="5" fill="#ff6900"/>
  <text x="179" y="173" font-size="10.5" class="mono" text-anchor="middle" font-weight="700" style="fill:#ffffff">mask 1</text>
</g>
<g class="a tag2">
  <rect x="364" y="142" width="62" height="18" rx="5" fill="#ff6900"/>
  <text x="395" y="155" font-size="10.5" class="mono" text-anchor="middle" font-weight="700" style="fill:#ffffff">mask 2</text>
</g>

<rect x="24" y="120" width="592" height="200" rx="16" fill="none" class="o"/>

<!-- Lens -->
<g class="lens">
  <line x1="30" y1="30" x2="60" y2="60" stroke="#1e3450" stroke-width="14" stroke-linecap="round"/>
  <line x1="35" y1="35" x2="57" y2="57" stroke="#ff8d32" stroke-width="7" stroke-linecap="round"/>
  <circle r="40" fill="#dff0ed" fill-opacity=".35" stroke="#1e3450" stroke-width="5"/>
  <path d="M-24 -18 A30 30 0 0 1 -6 -29" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- Token strip -->
<g>
    <rect x="24" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="46" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="68" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="90" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="112" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="134" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="156" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="178" y="342" width="16" height="16" rx="3" class="tk-img"/>
    <rect x="212" y="342" width="16" height="16" rx="3" class="tk-txt"/>
    <rect x="234" y="342" width="16" height="16" rx="3" class="tk-txt"/>
    <rect x="256" y="342" width="16" height="16" rx="3" class="tk-txt"/>
    <rect x="278" y="342" width="16" height="16" rx="3" class="tk-txt"/>
    <rect x="300" y="342" width="16" height="16" rx="3" class="tk-txt"/>
    <rect x="334" y="342" width="16" height="16" rx="3" class="tk-ans a t0"/>
    <rect x="356" y="342" width="16" height="16" rx="3" class="tk-ans a t1"/>
    <rect x="378" y="342" width="16" height="16" rx="3" class="tk-ans a t2"/>
    <rect x="400" y="342" width="16" height="16" rx="3" class="tk-mask a mt1"/>
    <rect x="422" y="342" width="16" height="16" rx="3" class="tk-ans a t4"/>
    <rect x="444" y="342" width="16" height="16" rx="3" class="tk-ans a t5"/>
    <rect x="466" y="342" width="16" height="16" rx="3" class="tk-ans a t6"/>
    <rect x="488" y="342" width="16" height="16" rx="3" class="tk-mask a mt2"/>
    <rect x="510" y="342" width="16" height="16" rx="3" class="tk-ans a t8"/>
    <rect x="532" y="342" width="16" height="16" rx="3" class="tk-ans a t9"/>
</g>
<g class="a thumb">
  <path d="M556 350 h8 l-4 -4 m4 4 l-4 4" fill="none" stroke="#1e3450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="572" y="336" width="44" height="28" rx="4" fill="#1e3450"/>
  <path d="M577 348 h20 v4 h-2 v8 h-16 v-8 h-2 Z" fill="#ffffff"/>
</g>
<path class="a thumb2" d="M600 342 h12 v4 h-1 v14 h-10 v-14 h-1 Z" fill="#ffffff"/>
<g font-size="10" class="mono">
  <text x="24" y="380" style="fill:#52657a">image</text>
  <text x="212" y="380" style="fill:#52657a">query</text>
  <text x="334" y="380" style="fill:#52657a">answer · <tspan style="fill:#b95018">&lt;|mask|&gt;</tspan></text>
  <text x="572" y="380" style="fill:#52657a">masks</text>
</g>
</svg>
